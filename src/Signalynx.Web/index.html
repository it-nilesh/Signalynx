          <h1>Signalynx: mediator and durable messaging for .NET</h1>
          <p>Signalynx is a high-performance, strongly typed mediator, dispatcher, and durable messaging toolkit for .NET 8, .NET 9, and .NET 10.</p>
          <h2>Core capabilities</h2>
          <p>Use typed commands, queries, requests, notifications, and domain events for in-process application dispatch. Add durable inbox, outbox, retries, scheduling, dead letters, persistent stores, and broker transports when work crosses time or service boundaries.</p>
          <h2>Supported integrations</h2>
          <p>Signalynx supports Microsoft dependency injection, validation, logging, NativeAOT source generation, SQL Server, PostgreSQL, RabbitMQ, Azure Service Bus, Amazon SQS, Kafka, and an in-memory development provider.</p>
          <h2>Install</h2>
          <p><code>dotnet add package Signalynx.Core</code></p>
          <p><a href="https://github.com/it-nilesh/Signalynx">Source code and documentation on GitHub</a> · <a href="https://www.nuget.org/packages/Signalynx.Core">Signalynx.Core on NuGet</a> · <a href="/llms.txt">AI-readable project overview</a></p>
