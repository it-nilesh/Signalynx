name: NativeAOT

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  publish-run:
    name: Publish and run NativeAOT sample
    runs-on: ubuntu-latest
    env:
      NATIVEAOT_PUBLISH_DIR: artifacts/nativeaot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install NativeAOT toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev binutils

      - name: Restore
        run: dotnet restore Signalynx.slnx

      - name: Publish NativeAOT sample
        run: dotnet publish samples/Signalynx.Samples.NativeAot/Signalynx.Samples.NativeAot.csproj -c Release -r linux-x64 --self-contained true -o "$NATIVEAOT_PUBLISH_DIR"

      - name: Run NativeAOT sample
        run: "$NATIVEAOT_PUBLISH_DIR/Signalynx.Samples.NativeAot"
